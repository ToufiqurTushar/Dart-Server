services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: my_app
      POSTGRES_PASSWORD: "Mr_U7k63ZbR32LUMq7BQ0woyI8Lt6jVX"
    volumes:
      - my_app_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "0-27mEze6tiA6tWNpahV6V6nHN-_93s4"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: my_app_test
      POSTGRES_PASSWORD: "svunBlPAjJgFZIEr5BEZFXqwz9m17Uv5"
    volumes:
      - my_app_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "Vid0ocQ3cqZIN098somAujHnD8j5PlJd"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  my_app_data:
  my_app_test_data:
